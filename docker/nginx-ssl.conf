# ─── HTTPS (production) ────────────────────────────────────────
# Built with:  docker build --build-arg NGINX_CONFIG=nginx-ssl.conf
#
# TLS certs are NOT baked into the image.  Mount them at deploy
# time, e.g.:
#   volumes:
#     - ./certs/fullchain.pem:/etc/nginx/ssl/cert.pem:ro
#     - ./certs/privkey.pem:/etc/nginx/ssl/key.pem:ro
# Or use a certbot sidecar and share its /etc/letsencrypt volume.
# ───────────────────────────────────────────────────────────────

# Redirect HTTP→HTTPS on the unprivileged :8080 (mapped to host :80
# by docker-compose in the prod profile).  Removed in dev profile.
server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.openrouter.ai https://*.openai.com https://*.anthropic.com https://*.gemini.google.com https://*.cloudflare.com https://*.cerebras.ai https://*.groq.com https://*.nvidia.com wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; worker-src 'self' blob:; child-src 'self' blob:; form-action 'self'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # BLD-09: CSP was missing in this location block — add it alongside HSTS
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.openrouter.ai https://*.openai.com https://*.anthropic.com https://*.gemini.google.com https://*.cloudflare.com https://*.cerebras.ai https://*.groq.com https://*.nvidia.com wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; worker-src 'self' blob:; child-src 'self' blob:; form-action 'self'; upgrade-insecure-requests" always;
        access_log off;
    }

    # ── LLM provider proxy routes ────────────────────────────────────
    # BLD-02: All /proxy/* paths must be proxied in production Docker.
    # ─────────────────────────────────────────────────────────────────

    location /proxy/gemini/ {
        proxy_pass ${PROXY_GEMINI:-https://generativelanguage.googleapis.com}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /proxy/openrouter/ {
        proxy_pass ${PROXY_OPENROUTER:-https://openrouter.ai}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /proxy/nvidia/ {
        proxy_pass ${PROXY_NVIDIA:-https://integrate.api.nvidia.com}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /proxy/groq/ {
        proxy_pass ${PROXY_GROQ:-https://api.groq.com/openai/v1}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /proxy/cerebras/ {
        proxy_pass ${PROXY_CEREBRAS:-https://api.cerebras.ai/v1}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /proxy/cloudflare/ {
        proxy_pass ${PROXY_CLOUDFLARE:-https://api.cloudflare.com/client/v4}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /proxy/ {
        proxy_pass ${PROXY_GENERIC:-https://api.openai.com}/;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass ${API_UPSTREAM:-https://api.openrouter.ai};
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
