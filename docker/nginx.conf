# ─── HTTP-only (development) ───────────────────────────────────
# Used by default (Dockerfile's NGINX_CONFIG arg).  Listens on
# 8080 inside the container; docker-compose maps it to host :80.
# For production TLS, build with:
#   docker build --build-arg NGINX_CONFIG=nginx-ssl.conf
# and mount a /etc/nginx/ssl volume via docker-compose.
# ───────────────────────────────────────────────────────────────

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (no HSTS over plain HTTP — would be ignored)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'" always;

    # SPA fallback — every unknown path returns index.html so the
    # client-side router can pick it up.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache static assets
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # API proxy — routes to whatever the host resolves.  Override at
    # deploy time with -e API_UPSTREAM=... if needed.
    location /api/ {
        proxy_pass ${API_UPSTREAM:-https://api.openrouter.ai};
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
